name: Agent pack submission
description: Suggest an agent for Grimling's general agent pack.
title: "[agent] "
labels: ["agent-pack"]
body:
  - type: markdown
    attributes:
      value: |
        Pack agents run on other people's machines, so they need a narrow job and a narrow tool list.
        No tools that send messages, spend money or delete things. Please leave out anything private.
  - type: input
    id: name
    attributes:
      label: Agent name
      placeholder: changelog-writer
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: What it does and when to use it
      description: One job, and the requests that should pick it.
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Tools it needs
      description: The exact `tools:` line, and why each tool is needed.
      render: text
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Agent file
      description: The full agent file (frontmatter and prompt), or a link to it.
      render: markdown
    validations:
      required: false
  - type: textarea
    id: dex
    attributes:
      label: Dex card (optional)
      description: Short name (up to 6 letters), category (code, research, web, ops, swarm) and 8x8 art if you have it. Art you submit is licensed CC BY 4.0 like the rest of Grimling's art.
      render: text
    validations:
      required: false
